name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest
        env:
          APP_MODE: testing
          GROQ_API_KEY: gsk_ci_dummy_key_for_testing_purposes
          ENCRYPTION_SECRET: v7N9kQ2xP4mR8wL1zT5yU0iO3aS6dF9g

