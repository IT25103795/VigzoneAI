name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest tests/
        env:
          APP_MODE: testing
          GROQ_API_KEY: gsk_test
          ENCRYPTION_SECRET: ci-only-encryption-secret-not-for-production-use

