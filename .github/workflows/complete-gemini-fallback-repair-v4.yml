name: complete-gemini-fallback-repair-v4

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/complete-gemini-fallback-repair-v4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply corrected repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/complete-gemini-fallback-repair-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(r"raise err\s*$", r"raise err[ \t]*$", 1)

          def fix_generated_tail(source: str, variable: str) -> str:
              marker = f"{variable} = r'''"
              block_start = source.index(marker) + len(marker)
              block_end = source.index("'''", block_start)
              raw = source[block_start:block_end]
              lines = raw.splitlines()
              if len(lines) < 2:
                  raise SystemExit(f'{variable} block unexpectedly short')
              fixed = lines[0] + '\n' + '\n'.join('    ' + line for line in lines[1:])
              return source[:block_start] + fixed + source[block_end:]

          script = fix_generated_tail(script, 'stream_tail')
          script = fix_generated_tail(script, 'chat_tail')
          exec(compile(script, '<guarded-gemini-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Focused tests
        run: pytest -q tests/test_gemini_fallback.py tests/test_model_and_streams.py
        env:
          APP_MODE: testing
          GROQ_API_KEY: gsk_test
          ENCRYPTION_SECRET: ci-only-encryption-secret-not-for-production-use
      - name: Full suite
        run: pytest tests/
        env:
          APP_MODE: testing
          GROQ_API_KEY: gsk_test
          ENCRYPTION_SECRET: ci-only-encryption-secret-not-for-production-use
      - name: Lint
        run: ruff check vigzone_ai.py tests/test_gemini_fallback.py
      - name: Commit repaired implementation
        shell: bash
        run: |
          git config user.name "Vigzone Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/complete-gemini-fallback-repair.yml \
                 .github/workflows/complete-gemini-fallback-repair-v2.yml \
                 .github/workflows/complete-gemini-fallback-repair-v3.yml \
                 .github/workflows/complete-gemini-fallback-repair-v4.yml
          git add -A
          git status --short
          git commit -m "fix: repair Gemini fallback and deploy safety"
          git push origin master
