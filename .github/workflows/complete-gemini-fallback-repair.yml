name: complete-gemini-fallback-repair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/complete-gemini-fallback-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply Gemini fallback repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("vigzone_ai.py")
          s = path.read_text(encoding="utf-8")

          duplicate_constants = '''# Gemini free-tier fallback - activates when Groq is rate-limited.
          GEMINI_FALLBACK_KEY = os.getenv("GOOGLE_API_KEY", "").strip()
          GEMINI_FALLBACK_MODEL = os.getenv("GEMINI_FALLBACK_MODEL", "gemini-2.0-flash")


          # Gemini free-tier fallback - activates when Groq is rate-limited.
          GEMINI_FALLBACK_KEY = os.getenv("GOOGLE_API_KEY", "").strip()
          GEMINI_FALLBACK_MODEL = os.getenv("GEMINI_FALLBACK_MODEL", "gemini-2.0-flash")
          '''
          clean_constants = '''# Optional server-only Gemini fallback. This is used only after every server-side
          # Groq text candidate has been rate-limited. Keep it separate from browser-safe
          # Google/Drive keys and never expose it to frontend code.
          GEMINI_FALLBACK_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          GEMINI_FALLBACK_MODEL = (
              os.getenv("GEMINI_FALLBACK_MODEL", "gemini-3.6-flash").strip()
              or "gemini-3.6-flash"
          )
          '''
          if duplicate_constants not in s:
              raise SystemExit("expected duplicate Gemini constants were not found")
          s = s.replace(duplicate_constants, clean_constants, 1)

          helper_start = s.index("\n\nasync def _gemini_fallback_stream(")
          helper_end = s.index("\ndef _untrusted_context", helper_start)
          helpers = r'''
          def _should_use_gemini_fallback(
              error: Optional[VigzoneAIError],
              *,
              using_override: bool,
              contains_image: bool,
          ) -> bool:
              """Use the shared Gemini fallback only for server Groq text 429s."""

              return bool(
                  GEMINI_FALLBACK_KEY
                  and not using_override
                  and not contains_image
                  and error is not None
                  and getattr(error, "code", "") == "provider_rate_limit"
              )


          def _gemini_text_parts(content) -> list[dict]:
              if isinstance(content, str):
                  text = content.strip()
                  return [{"text": text}] if text else []
              if isinstance(content, list):
                  parts = []
                  for part in content:
                      if not isinstance(part, dict) or part.get("type") != "text":
                          continue
                      text = str(part.get("text") or "").strip()
                      if text:
                          parts.append({"text": text})
                  return parts
              text = str(content or "").strip()
              return [{"text": text}] if text else []


          def _gemini_request_payload(messages: list[dict]) -> dict:
              """Translate the already-built Zoner/Groq prompt into Gemini chat format."""

              system_parts: list[dict] = []
              contents: list[dict] = []
              for message in messages:
                  if not isinstance(message, dict):
                      continue
                  role = str(message.get("role") or "user").strip().lower()
                  parts = _gemini_text_parts(message.get("content"))
                  if not parts:
                      continue
                  if role == "system":
                      system_parts.extend(parts)
                      continue

                  gemini_role = "model" if role == "assistant" else "user"
                  if contents and contents[-1].get("role") == gemini_role:
                      contents[-1]["parts"].extend(parts)
                  else:
                      contents.append({"role": gemini_role, "parts": parts})

              if not contents:
                  raise VigzoneAIError("Gemini fallback could not build a text request.")

              request: dict = {
                  "contents": contents,
                  # Gemini 3.6 deprecated temperature/top_p/top_k. Keep only the
                  # bounded output budget so newer model generations stay compatible.
                  "generationConfig": {"maxOutputTokens": 2048},
              }
              if system_parts:
                  request["systemInstruction"] = {"parts": system_parts}
              return request


          def _gemini_headers() -> dict[str, str]:
              return {
                  "Content-Type": "application/json",
                  "x-goog-api-key": GEMINI_FALLBACK_KEY,
              }


          def _gemini_url(*, stream: bool) -> str:
              method = "streamGenerateContent?alt=sse" if stream else "generateContent"
              return (
                  "https://generativelanguage.googleapis.com/v1beta/models/"
                  f"{GEMINI_FALLBACK_MODEL}:{method}"
              )


          def _gemini_response_text(data: dict) -> str:
              chunks: list[str] = []
              for candidate in data.get("candidates") or []:
                  if not isinstance(candidate, dict):
                      continue
                  content = candidate.get("content") or {}
                  for part in content.get("parts") or []:
                      if isinstance(part, dict) and isinstance(part.get("text"), str):
                          chunks.append(part["text"])
              return "".join(chunks).strip()


          def _gemini_provider_error(status_code: int) -> VigzoneAIError:
              if status_code in {401, 403}:
                  message = "Gemini fallback credentials were rejected. Check GEMINI_API_KEY on the server."
                  code = "provider_error"
              elif status_code == 404:
                  message = "The configured Gemini fallback model is unavailable."
                  code = "provider_error"
              elif status_code == 429:
                  message = "Groq and the Gemini fallback are both rate-limited right now. Please try again shortly."
                  code = "provider_rate_limit"
              elif status_code >= 500:
                  message = "Groq is rate-limited and the Gemini fallback is temporarily unavailable."
                  code = "provider_error"
              else:
                  message = f"Gemini fallback failed with status {status_code}."
                  code = "provider_error"
              return VigzoneAIError(message, code=code)


          async def _gemini_fallback_once(messages: list[dict]) -> str:
              """Return one Gemini text response for the non-streaming chat path."""

              if not GEMINI_FALLBACK_KEY:
                  raise VigzoneAIError("Gemini fallback is not configured.")
              client = _get_client()
              try:
                  response = await client.post(
                      _gemini_url(stream=False),
                      json=_gemini_request_payload(messages),
                      headers=_gemini_headers(),
                  )
              except httpx.RequestError as exc:
                  raise VigzoneAIError(
                      "Could not reach the Gemini fallback provider."
                  ) from exc
              if response.status_code != 200:
                  raise _gemini_provider_error(response.status_code)
              try:
                  data = response.json()
              except ValueError as exc:
                  raise VigzoneAIError("Gemini fallback returned invalid JSON.") from exc
              text = _gemini_response_text(data if isinstance(data, dict) else {})
              if not text:
                  raise VigzoneAIError("Gemini fallback returned an empty completion.")
              return text


          async def _gemini_fallback_stream(
              messages: list[dict],
          ) -> AsyncGenerator[str, None]:
              """Stream Gemini text chunks for the live chat path."""

              if not GEMINI_FALLBACK_KEY:
                  raise VigzoneAIError("Gemini fallback is not configured.")
              client = _get_client()
              try:
                  async with client.stream(
                      "POST",
                      _gemini_url(stream=True),
                      json=_gemini_request_payload(messages),
                      headers=_gemini_headers(),
                  ) as response:
                      if response.status_code != 200:
                          await response.aread()
                          raise _gemini_provider_error(response.status_code)
                      async for line in response.aiter_lines():
                          if not line or not line.startswith("data: "):
                              continue
                          raw = line[len("data: "):].strip()
                          if not raw or raw == "[DONE]":
                              continue
                          try:
                              data = json.loads(raw)
                          except json.JSONDecodeError:
                              continue
                          text = _gemini_response_text(data if isinstance(data, dict) else {})
                          if text:
                              yield text
              except httpx.RequestError as exc:
                  raise VigzoneAIError(
                      "Could not reach the Gemini fallback provider."
                  ) from exc
          '''
          s = s[:helper_start] + "\n\n" + helpers.strip() + "\n\n" + s[helper_end + 1:]

          fallback_marker = '''                        if can_fallback:
                              logger.warning(
                                  "Groq model %s failed with status %s; trying fallback "
                                  "model %s",
                                  payload.get("model"),
                                  resp.status_code,
                                  candidates[candidate_index + 1],
                              )
                              break
                          raise err'''
          fallback_replacement = '''                        if can_fallback:
                              logger.warning(
                                  "Groq model %s failed with status %s; trying fallback "
                                  "model %s",
                                  payload.get("model"),
                                  resp.status_code,
                                  candidates[candidate_index + 1],
                              )
                              break
                          if _should_use_gemini_fallback(
                              err,
                              using_override=using_override,
                              contains_image=contains_image,
                          ):
                              break
                          raise err'''
          occurrences = s.count(fallback_marker)
          if occurrences != 2:
              raise SystemExit(f"expected 2 final Groq error blocks, found {occurrences}")
          s = s.replace(fallback_marker, fallback_replacement, 2)

          stream_fn = s.index("async def stream_chat(")
          stream_tail = s.index("\n    if last_error:\n        # Gemini fallback", stream_fn)
          stream_end = s.index("\n\n# ── Non-streaming chat", stream_tail)
          new_stream_tail = r'''
              if last_error:
                  if _should_use_gemini_fallback(
                      last_error,
                      using_override=using_override,
                      contains_image=contains_image,
                  ):
                      gemini_messages = (
                          payload.get("messages")
                          if isinstance(payload, dict)
                          else None
                      ) or messages
                      attempt_count += 1
                      logger.warning(
                          "All Groq candidates were rate-limited. Falling back to Gemini %s.",
                          GEMINI_FALLBACK_MODEL,
                      )
                      full_text = ""
                      async for chunk in _gemini_fallback_stream(gemini_messages):
                          if not first_token_ms:
                              first_token_ms = max(
                                  1,
                                  int((time.perf_counter() - request_started) * 1000),
                              )
                          if quota_reservation is not None:
                              quota_reservation["provider_accepted"] = True
                          full_text += chunk
                          yield chunk

                      if not full_text.strip():
                          raise VigzoneAIError("Gemini fallback returned an empty completion.")

                      prompt_used = _estimate_payload_prompt_tokens(gemini_messages)
                      completion_used = _estimate_tokens(full_text)
                      component_tokens = (
                          _payload_component_tokens(payload)
                          if isinstance(payload, dict)
                          else {}
                      )
                      latency_ms = max(
                          1,
                          int((time.perf_counter() - request_started) * 1000),
                      )
                      usage_id = None
                      if user_id and not IS_TESTING:
                          usage_id = track_token_usage(
                              user_id,
                              prompt_used,
                              completion_used,
                              provider="gemini",
                              estimated=True,
                              model=GEMINI_FALLBACK_MODEL,
                              routed_model=routed_model,
                              route_reason=(route_reason if ROUTING_ANALYTICS_ENABLED else ""),
                              routing_mode=routing_mode,
                              fallback_used=True,
                              retry_count=max(0, attempt_count - 1),
                              latency_ms=latency_ms,
                              time_to_first_token_ms=first_token_ms or latency_ms,
                              cached_tokens=0,
                              component_tokens=component_tokens,
                              conversation_id=conversation_id,
                              quota_reservation=quota_reservation,
                          )
                      build_meta = payload.get("_vigzone_meta") if isinstance(payload, dict) else {}
                      build_meta = build_meta or {}
                      _notify_metadata(
                          metadata_callback,
                          {
                              "usage_id": usage_id,
                              "provider": "gemini",
                              "model": GEMINI_FALLBACK_MODEL,
                              "routed_model": routed_model,
                              "route_reason": route_reason,
                              "routing_mode": (routing_mode or "general").strip().lower(),
                              "fallback_used": True,
                              "retry_count": max(0, attempt_count - 1),
                              "prompt_tokens": prompt_used,
                              "completion_tokens": completion_used,
                              "total_tokens": prompt_used + completion_used,
                              "cached_tokens": 0,
                              "usage_estimated": True,
                              "latency_ms": latency_ms,
                              "time_to_first_token_ms": first_token_ms or latency_ms,
                              "context_breakdown_estimated": True,
                              "context": component_tokens,
                              "zoner": build_meta.get("zoner") or ZONER_PROFILE.runtime_metadata(),
                              "prompt_modules": build_meta.get("prompt_modules") or [],
                              "context_duplicates_removed": build_meta.get(
                                  "context_duplicates_removed", 0
                              ),
                              "history": build_meta.get("history") or {},
                          },
                      )
                      return
                  raise last_error
              raise VigzoneAIError("Groq returned no response.")
          '''
          s = s[:stream_tail] + "\n" + new_stream_tail.strip("\n") + s[stream_end:]

          chat_fn = s.index("async def chat_once(")
          chat_tail = s.index("\n    if last_error:\n        # Gemini fallback", chat_fn)
          new_chat_tail = r'''
              if last_error:
                  if _should_use_gemini_fallback(
                      last_error,
                      using_override=using_override,
                      contains_image=contains_image,
                  ):
                      gemini_messages = (
                          payload.get("messages")
                          if isinstance(payload, dict)
                          else None
                      ) or messages
                      attempt_count += 1
                      logger.warning(
                          "All Groq candidates were rate-limited. Falling back to Gemini %s.",
                          GEMINI_FALLBACK_MODEL,
                      )
                      reply = await _gemini_fallback_once(gemini_messages)
                      if quota_reservation is not None:
                          quota_reservation["provider_accepted"] = True
                      prompt_used = _estimate_payload_prompt_tokens(gemini_messages)
                      completion_used = _estimate_tokens(reply)
                      component_tokens = (
                          _payload_component_tokens(payload)
                          if isinstance(payload, dict)
                          else {}
                      )
                      latency_ms = max(
                          1,
                          int((time.perf_counter() - request_started) * 1000),
                      )
                      usage_id = None
                      if user_id and not IS_TESTING:
                          usage_id = track_token_usage(
                              user_id,
                              prompt_used,
                              completion_used,
                              provider="gemini",
                              estimated=True,
                              model=GEMINI_FALLBACK_MODEL,
                              routed_model=routed_model,
                              route_reason=(route_reason if ROUTING_ANALYTICS_ENABLED else ""),
                              routing_mode=routing_mode,
                              fallback_used=True,
                              retry_count=max(0, attempt_count - 1),
                              latency_ms=latency_ms,
                              time_to_first_token_ms=latency_ms,
                              cached_tokens=0,
                              component_tokens=component_tokens,
                              conversation_id=conversation_id,
                              quota_reservation=quota_reservation,
                          )
                      build_meta = payload.get("_vigzone_meta") if isinstance(payload, dict) else {}
                      build_meta = build_meta or {}
                      _notify_metadata(
                          metadata_callback,
                          {
                              "usage_id": usage_id,
                              "provider": "gemini",
                              "model": GEMINI_FALLBACK_MODEL,
                              "routed_model": routed_model,
                              "route_reason": route_reason,
                              "routing_mode": (routing_mode or "general").strip().lower(),
                              "fallback_used": True,
                              "retry_count": max(0, attempt_count - 1),
                              "prompt_tokens": prompt_used,
                              "completion_tokens": completion_used,
                              "total_tokens": prompt_used + completion_used,
                              "cached_tokens": 0,
                              "usage_estimated": True,
                              "latency_ms": latency_ms,
                              "time_to_first_token_ms": latency_ms,
                              "context_breakdown_estimated": True,
                              "context": component_tokens,
                              "zoner": build_meta.get("zoner") or ZONER_PROFILE.runtime_metadata(),
                              "prompt_modules": build_meta.get("prompt_modules") or [],
                              "context_duplicates_removed": build_meta.get(
                                  "context_duplicates_removed", 0
                              ),
                              "history": build_meta.get("history") or {},
                          },
                      )
                      return reply
                  raise last_error
              raise VigzoneAIError("Groq returned no response.")
          '''
          s = s[:chat_tail] + "\n" + new_chat_tail.strip("\n") + "\n"

          quota_sql = "provider IN ('groq', 'groq_audio', 'groq_interrupted')"
          if quota_sql not in s:
              raise SystemExit("expected quota provider filter was not found")
          s = s.replace(
              quota_sql,
              "provider IN ('groq', 'gemini', 'groq_audio', 'groq_interrupted')",
              1,
          )

          path.write_text(s, encoding="utf-8")

          env_path = Path(".env.example")
          env_text = env_path.read_text(encoding="utf-8")
          env_anchor = "GROQ_TRANSCRIPTION_MODEL=whisper-large-v3-turbo\n"
          env_insert = '''GROQ_TRANSCRIPTION_MODEL=whisper-large-v3-turbo

          # Optional server-only text fallback used only when every server Groq text
          # candidate is rate-limited. Never expose this key to browser code.
          GEMINI_API_KEY=
          GEMINI_FALLBACK_MODEL=gemini-3.6-flash
          '''
          if env_anchor not in env_text:
              raise SystemExit(".env.example Gemini insertion point not found")
          env_text = env_text.replace(env_anchor, env_insert, 1)
          env_path.write_text(env_text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          old_intro = (
              "Vigzone AI is a private, multi-user AI workspace built with FastAPI and a responsive browser client. "
              "Chat, vision, and transcription use Groq. Image generation uses OpenAI when configured and otherwise "
              "uses a clearly labelled Pollinations fallback."
          )
          new_intro = (
              "Vigzone AI is a private, multi-user AI workspace built with FastAPI and a responsive browser client. "
              "Chat, vision, and transcription use Groq by default; text chat can optionally fail over to Gemini when "
              "all server-side Groq candidates are rate-limited. Image generation uses OpenAI when configured and "
              "otherwise uses a clearly labelled Pollinations fallback."
          )
          if old_intro not in readme_text:
              raise SystemExit("README intro text not found")
          readme_text = readme_text.replace(old_intro, new_intro, 1)
          optional_anchor = "## Optional providers\n\n"
          optional_insert = (
              "## Optional providers\n\n"
              "- `GEMINI_API_KEY`: server-only Gemini fallback for text chat after all configured server Groq candidates "
              "return provider rate limits. `GEMINI_FALLBACK_MODEL` defaults to `gemini-3.6-flash`. The fallback is not "
              "used for personal Groq keys or image chats.\n"
          )
          if optional_anchor not in readme_text:
              raise SystemExit("README optional providers section not found")
          readme_text = readme_text.replace(optional_anchor, optional_insert, 1)
          readme.write_text(readme_text, encoding="utf-8")

          tests = r'''"""Focused regression checks for the Groq -> Gemini text fallback."""

          from __future__ import annotations

          import asyncio
          import json

          import httpx


          class _PostResponse:
              headers = httpx.Headers()

              def __init__(self, status_code: int, *, text: str = "", body=None):
                  self.status_code = status_code
                  self.text = text
                  self._body = body

              def json(self):
                  return self._body


          class _StreamResponse:
              headers = httpx.Headers()

              def __init__(self, status_code: int, *, body: str = "", lines=None):
                  self.status_code = status_code
                  self._body = body.encode()
                  self._lines = lines or []

              async def aread(self):
                  return self._body

              async def aiter_lines(self):
                  for line in self._lines:
                      yield line


          class _StreamContext:
              def __init__(self, response):
                  self.response = response

              async def __aenter__(self):
                  return self.response

              async def __aexit__(self, *_args):
                  return False


          def _built_payload(model: str, stream: bool) -> dict:
              return {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": "Zoner policy and private context"},
                      {"role": "user", "content": "Explain RAM simply"},
                  ],
                  "stream": stream,
                  "_vigzone_meta": {"prompt_modules": ["core"]},
              }


          def test_gemini_request_preserves_built_zoner_context(monkeypatch):
              import vigzone_ai

              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_KEY", "gemini-test-key")
              payload = vigzone_ai._gemini_request_payload(
                  _built_payload("groq-model", False)["messages"]
              )

              assert payload["systemInstruction"]["parts"][0]["text"] == "Zoner policy and private context"
              assert payload["contents"][-1]["role"] == "user"
              assert payload["contents"][-1]["parts"][0]["text"] == "Explain RAM simply"
              assert payload["generationConfig"] == {"maxOutputTokens": 2048}
              assert "temperature" not in payload["generationConfig"]


          def test_chat_once_returns_gemini_after_final_groq_429(monkeypatch):
              import vigzone_ai

              calls = []

              async def build_payload(_messages, model, stream, **_kwargs):
                  return _built_payload(model, stream)

              class Client:
                  async def post(self, url, **kwargs):
                      calls.append((url, kwargs))
                      if "api.groq.com" in url:
                          return _PostResponse(
                              429,
                              text=json.dumps(
                                  {"error": {"message": "tokens per day; please try again in 5s"}}
                              ),
                          )
                      return _PostResponse(
                          200,
                          body={
                              "candidates": [
                                  {"content": {"parts": [{"text": "Gemini answer"}]}}
                              ]
                          },
                      )

              metadata = []
              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_KEY", "gemini-test-key")
              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_MODEL", "gemini-3.6-flash")
              monkeypatch.setattr(vigzone_ai, "_build_payload", build_payload)
              monkeypatch.setattr(vigzone_ai, "_model_candidates", lambda *_a, **_k: ["primary"])
              monkeypatch.setattr(vigzone_ai, "_get_client", lambda: Client())

              reply = asyncio.run(
                  vigzone_ai.chat_once(
                      [{"role": "user", "content": "Explain RAM simply"}],
                      metadata_callback=metadata.append,
                  )
              )

              assert reply == "Gemini answer"
              assert len(calls) == 2
              gemini_url, gemini_kwargs = calls[1]
              assert "gemini-3.6-flash:generateContent" in gemini_url
              assert gemini_kwargs["headers"]["x-goog-api-key"] == "gemini-test-key"
              assert "key=" not in gemini_url
              assert gemini_kwargs["json"]["systemInstruction"]["parts"][0]["text"] == "Zoner policy and private context"
              assert metadata[-1]["provider"] == "gemini"
              assert metadata[-1]["fallback_used"] is True


          def test_stream_chat_streams_gemini_after_final_groq_429(monkeypatch):
              import vigzone_ai

              calls = []

              async def build_payload(_messages, model, stream, **_kwargs):
                  return _built_payload(model, stream)

              class Client:
                  def stream(self, method, url, **kwargs):
                      calls.append((method, url, kwargs))
                      if "api.groq.com" in url:
                          return _StreamContext(
                              _StreamResponse(
                                  429,
                                  body=json.dumps(
                                      {"error": {"message": "tokens per day; please try again in 5s"}}
                                  ),
                              )
                          )
                      return _StreamContext(
                          _StreamResponse(
                              200,
                              lines=[
                                  'data: {"candidates":[{"content":{"parts":[{"text":"Gemini "}]}}]}',
                                  'data: {"candidates":[{"content":{"parts":[{"text":"stream"}]}}]}',
                              ],
                          )
                      )

              client = Client()
              metadata = []
              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_KEY", "gemini-test-key")
              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_MODEL", "gemini-3.6-flash")
              monkeypatch.setattr(vigzone_ai, "_build_payload", build_payload)
              monkeypatch.setattr(vigzone_ai, "_model_candidates", lambda *_a, **_k: ["primary"])
              monkeypatch.setattr(vigzone_ai, "_get_client", lambda: client)

              async def collect():
                  return "".join(
                      [
                          chunk
                          async for chunk in vigzone_ai.stream_chat(
                              [{"role": "user", "content": "Explain RAM simply"}],
                              metadata_callback=metadata.append,
                          )
                      ]
                  )

              assert asyncio.run(collect()) == "Gemini stream"
              assert len(calls) == 2
              _, gemini_url, gemini_kwargs = calls[1]
              assert "gemini-3.6-flash:streamGenerateContent?alt=sse" in gemini_url
              assert gemini_kwargs["headers"]["x-goog-api-key"] == "gemini-test-key"
              assert "key=" not in gemini_url
              assert gemini_kwargs["json"]["systemInstruction"]["parts"][0]["text"] == "Zoner policy and private context"
              assert metadata[-1]["provider"] == "gemini"
              assert metadata[-1]["fallback_used"] is True


          def test_personal_groq_key_does_not_consume_shared_gemini_fallback(monkeypatch):
              import vigzone_ai

              monkeypatch.setattr(vigzone_ai, "GEMINI_FALLBACK_KEY", "gemini-test-key")
              err = vigzone_ai.VigzoneAIError("limited", code="provider_rate_limit")
              assert vigzone_ai._should_use_gemini_fallback(
                  err,
                  using_override=True,
                  contains_image=False,
              ) is False
              assert vigzone_ai._should_use_gemini_fallback(
                  err,
                  using_override=False,
                  contains_image=True,
              ) is False
          '''
          Path("tests/test_gemini_fallback.py").write_text(tests, encoding="utf-8")

          for accidental in (
