<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self';">
  <title>Starting Vigzone AI</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main class="splash-shell" aria-label="Vigzone AI is starting">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <section class="brand-lockup" aria-label="Vigzone AI">
      <div class="mark-stage" aria-hidden="true">
        <span class="mark-halo"></span>
        <span class="mark-orbit orbit-one"></span>
        <span class="mark-orbit orbit-two"></span>
        <img class="brand-mark" src="../static/icons/vigzone-icon-256.png" alt="">
      </div>
      <div class="word-stage" aria-hidden="true">
        <span class="word-name">igzone</span><span class="word-ai"> AI</span>
      </div>
    </section>

    <section class="startup-status" aria-live="polite">
      <p>Preparing your workspace</p>
      <div class="progress-track" aria-hidden="true"><span></span></div>
    </section>
  </main>
</body>
</html>
