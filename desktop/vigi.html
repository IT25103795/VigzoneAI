<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self';">
  <title>Vigi</title>
  <link rel="stylesheet" href="vigi.css">
</head>
<body>
  <main class="desktop-vigi" id="desktopVigi" data-state="ready">
    <section class="speech-panel" id="speechPanel" aria-label="Ask Vigi" aria-hidden="true">
      <header>
        <div>
          <span class="eyebrow">Vigi</span>
          <strong id="chatContext">Last opened Vigzone chat</strong>
        </div>
        <button class="icon-button" id="collapseButton" type="button" aria-label="Collapse Vigi">×</button>
      </header>

      <p class="welcome-copy" id="welcomeCopy">Ask anything. It continues in your last Vigzone chat.</p>

      <form id="quickForm">
        <label class="sr-only" for="quickPrompt">Message Vigi</label>
        <textarea id="quickPrompt" maxlength="4000" rows="2" placeholder="Ask anything from Vigi…"></textarea>
        <div class="quick-row">
          <span id="promptCount">0 / 4000</span>
          <button class="ask-button" id="askButton" type="submit"><span>✦</span> Ask Vigi</button>
        </div>
      </form>

      <section class="reply-preview" id="replyPreview" aria-live="polite" hidden>
        <div class="reply-head"><span class="reply-dot"></span><strong>Vigi replied</strong></div>
        <p id="replyText"></p>
        <small>Open Vigzone to read and continue the full conversation.</small>
        <button id="openConversationButton" type="button">Open full conversation →</button>
      </section>

      <p class="status-copy" id="statusCopy" role="status" aria-live="polite"></p>
      <span class="speech-tail" aria-hidden="true"></span>
    </section>

    <section class="pet-stage">
      <div class="drag-handle" title="Drag Vigi" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="pet-button" id="petButton" type="button" aria-expanded="false" aria-controls="speechPanel" title="Click to ask · drag to move · right-click for options">
        <span class="pet-glow" aria-hidden="true"></span>
        <img src="../static/assets/vigi/classic-vigi-v1.png" alt="Vigi desktop companion" draggable="false">
        <span class="activity-orbit" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="live-dot" aria-hidden="true"></span>
      </button>
      <div class="pet-hint" id="petHint">Click to ask Vigi</div>
    </section>
  </main>
  <script src="vigi-renderer.js"></script>
</body>
</html>
