[project]
name = "vigzoneai"
version = "5.0.0"
description = "Private multi-user AI workspace powered by Groq"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "python-dotenv==1.1.1",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "Pillow==12.3.0",
    "pypdf==6.14.2",
    "pypdfium2==5.12.1",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "python-magic==0.4.27",
    "cryptography==49.0.0",
    "defusedxml==0.7.1",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "httpx2==2.9.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
