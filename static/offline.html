<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vigzone AI — Offline</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0f;--surface:#161922;--text:#eceef4;--muted:#9aa3b7;--accent:#ff6b4a;--border:#ffffff18}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#ff6b4a24,transparent 42%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;padding:22px}
    .card{max-width:520px;border:1px solid var(--border);background:#161922cc;backdrop-filter:blur(16px);border-radius:24px;padding:28px;box-shadow:0 28px 90px -48px #000}
    .icon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#ff6b4a18;color:var(--accent);font-size:28px;margin-bottom:16px}
    h1{margin:0 0 8px;font-size:26px;letter-spacing:-.03em}p{margin:0 0 18px;color:var(--muted)}
    a,button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;background:var(--accent);color:white;text-decoration:none;font-weight:800;padding:10px 14px;cursor:pointer}
    .sub{font-size:12px;color:var(--muted);margin-top:16px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⌁</div>
    <h1>Vigzone is offline</h1>
    <p>You can still open the cached app and read saved chats. AI replies, uploads, sync, admin data and image generation need internet.</p>
    <a href="/chat">Open cached chat</a>
    <button onclick="location.reload()">Try again</button>
    <div class="sub">Tip: open Vigzone once while online so the offline app shell is saved on this device.</div>
  </main>
</body>
</html>
